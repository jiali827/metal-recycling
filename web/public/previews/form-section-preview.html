<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弹窗分区样式 · 四方案切换预览 v2</title>
    <style>
      :root {
        --background: #f4f6f9;
        --foreground: #0f172a;
        --card: #ffffff;
        --muted: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --chip: #f1f5f9;
        --brand: #6366f1;
        --danger: #dc2626;
        --radius-card: 12px;
        --radius-control: 8px;
        --shadow-panel: 0 20px 50px rgb(15 23 42 / 0.18);
        --control-height-md: 2.5rem;
        --focus-border: var(--brand);
        --focus-ring: 0 0 0 3px rgb(99 102 241 / 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--foreground);
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        line-height: 1.5;
      }

      .page {
        max-width: 52rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }

      .page-header h1 {
        margin: 0 0 0.375rem;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .page-header p {
        margin: 0 0 1rem;
        font-size: 0.8125rem;
        color: var(--muted);
      }

      .cache-note {
        margin-bottom: 1rem;
        padding: 0.625rem 0.875rem;
        border-radius: var(--radius-control);
        background: #fff7ed;
        border: 1px solid #fed7aa;
        font-size: 0.75rem;
        color: #9a3412;
      }

      .scheme-tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .scheme-tab {
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: #fff;
        padding: 0.625rem 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .scheme-tab:hover {
        border-color: var(--border-strong);
        color: var(--foreground);
      }

      .scheme-tab.is-active {
        border-color: var(--brand);
        color: var(--brand);
        box-shadow: var(--focus-ring);
      }

      .scheme-tab small {
        display: block;
        margin-top: 0.125rem;
        font-size: 0.6875rem;
        font-weight: 500;
        color: var(--muted);
      }

      .scheme-tab.is-active small {
        color: #6366f1;
      }

      .scheme-desc {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: #fff;
        font-size: 0.8125rem;
        color: var(--muted);
      }

      .scheme-desc strong {
        color: var(--foreground);
      }

      .ui-modal {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--card);
        box-shadow: var(--shadow-panel);
        overflow: hidden;
      }

      .ui-modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 1.25rem 0;
      }

      .ui-modal-head h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      .scheme-badge {
        display: inline-flex;
        align-items: center;
        height: 1.5rem;
        padding: 0 0.5rem;
        border-radius: 999px;
        background: var(--chip);
        font-size: 0.6875rem;
        font-weight: 600;
        color: var(--muted);
      }

      .ui-modal-close {
        display: inline-flex;
        height: 2rem;
        width: 2rem;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .ui-modal-body {
        max-height: min(72vh, 680px);
        overflow-y: auto;
        padding: 1rem 1.25rem 1.25rem;
      }

      .ui-modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0 1.25rem 1.25rem;
      }

      .ui-btn-secondary,
      .ui-btn-primary {
        height: 2.25rem;
        padding: 0 1rem;
        border-radius: var(--radius-control);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }

      .ui-btn-secondary {
        border: 1px solid var(--border);
        background: #fff;
      }

      .ui-btn-primary {
        border: 1px solid var(--brand);
        background: var(--brand);
        color: #fff;
      }

      .ui-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .ui-form-span-2 {
        grid-column: 1 / -1;
      }

      .ui-form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--muted);
      }

      .ui-form-required {
        margin-left: 2px;
        color: var(--danger);
      }

      .ui-input,
      .ui-control-trigger,
      .ui-input-affix {
        margin-top: 0.25rem;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: #fff;
        font-size: 0.875rem;
        color: var(--foreground);
      }

      .ui-input,
      .ui-control-trigger {
        height: var(--control-height-md);
        padding: 0 0.75rem;
      }

      .ui-control-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        cursor: pointer;
      }

      .ui-control-trigger.is-open {
        border-color: var(--focus-border);
        box-shadow: var(--focus-ring);
      }

      .ui-control-trigger:disabled {
        background: var(--chip);
        color: #94a3b8;
      }

      .ui-input-affix {
        display: flex;
        overflow: hidden;
      }

      .ui-input-affix-input {
        flex: 1;
        min-width: 0;
        height: var(--control-height-md);
        border: 0;
        background: transparent;
        padding: 0 0.75rem;
        font-size: 0.875rem;
        outline: none;
      }

      .ui-input-affix-suffix {
        display: flex;
        align-items: center;
        padding: 0 0.75rem;
        border-left: 1px solid var(--border);
        background: var(--chip);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--muted);
      }

      .ui-form-readonly {
        margin-top: 0.25rem;
        display: flex;
        height: var(--control-height-md);
        align-items: center;
        font-size: 0.875rem;
      }

      .ui-form-readonly .muted {
        color: var(--muted);
      }

      .ui-segmented {
        margin-top: 0.25rem;
        display: flex;
        gap: 0.25rem;
        padding: 0.25rem;
        border-radius: var(--radius-control);
        background: var(--chip);
      }

      .ui-segmented-item {
        flex: 1;
        height: calc(var(--control-height-md) - 0.5rem);
        border: 0;
        border-radius: calc(var(--radius-control) - 2px);
        background: transparent;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
      }

      .ui-segmented-item.is-active {
        background: #fff;
        color: var(--brand);
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.08);
      }

      textarea.ui-input {
        height: auto;
        min-height: 4.5rem;
        padding: 0.5rem 0.75rem;
        resize: vertical;
      }

      /* ===== 方案 A ===== */
      #preview-root.scheme-a .form-stack {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      #preview-root.scheme-a .section-title {
        margin: 0 0 0.75rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--foreground);
      }

      /* ===== 方案 B ===== */
      #preview-root.scheme-b .section + .section {
        margin-top: 0.25rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
      }

      #preview-root.scheme-b .section-title {
        margin: 0 0 0.875rem;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted);
      }

      /* ===== 方案 C ===== */
      #preview-root.scheme-c .form-stack {
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
      }

      #preview-root.scheme-c .section-title {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        margin: 0 0 0.875rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--foreground);
      }

      #preview-root.scheme-c .section-title::before {
        content: "";
        width: 3px;
        height: 0.875rem;
        border-radius: 999px;
        background: var(--brand);
        flex-shrink: 0;
      }

      /* ===== 方案 D ===== */
      #preview-root.scheme-d .form-stack {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      #preview-root.scheme-d .section-title {
        margin: 0 0 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #334155;
      }

      @media (max-width: 640px) {
        .scheme-tabs {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .ui-form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-header">
        <h1>弹窗分区样式 · 四方案切换预览</h1>
        <p>点击上方 Tab 切换 A / B / C / D，同一个完整弹窗会即时换分区样式。重点对比「过磅数据」和「补充信息」之间的分隔。</p>
      </div>

      <div class="cache-note">
        静态 HTML 没有热更新。改完文件后请 <strong>Cmd+Shift+R</strong> 强制刷新；若仍不对，试
        <a href="?v=2">?v=2</a> 清缓存。
      </div>

      <div class="scheme-tabs" role="tablist" aria-label="分区方案">
        <button type="button" class="scheme-tab is-active" data-scheme="a" role="tab" aria-selected="true">
          方案 A
          <small>标题下划线</small>
        </button>
        <button type="button" class="scheme-tab" data-scheme="b" role="tab" aria-selected="false">
          方案 B
          <small>顶部分隔线</small>
        </button>
        <button type="button" class="scheme-tab" data-scheme="c" role="tab" aria-selected="false">
          方案 C
          <small>左色条</small>
        </button>
        <button type="button" class="scheme-tab" data-scheme="d" role="tab" aria-selected="false">
          方案 D
          <small>大间距</small>
        </button>
      </div>

      <p id="scheme-desc" class="scheme-desc">
        <strong>方案 A · 当前线上：</strong>分区标题 14px 黑色加粗，标题下方有横线，区块间距 24px。
      </p>

      <div id="preview-root" class="scheme-a">
        <div class="ui-modal" role="dialog" aria-label="新建磅单预览">
          <div class="ui-modal-head">
            <div>
              <h3>新建磅单</h3>
              <span id="scheme-badge" class="scheme-badge">当前：方案 A</span>
            </div>
            <button type="button" class="ui-modal-close" aria-label="关闭">✕</button>
          </div>
          <div class="ui-modal-body">
            <div class="form-stack">
              <section class="section">
                <h4 class="section-title">基本信息</h4>
                <div class="ui-form-grid">
                  <div>
                    <label class="ui-form-label">单号 BX<span class="ui-form-required">*</span></label>
                    <input class="ui-input" value="38472" readonly />
                  </div>
                  <div>
                    <label class="ui-form-label">车牌 Truck No.</label>
                    <input class="ui-input" value="SD3117" />
                  </div>
                  <div>
                    <label class="ui-form-label">关联合同</label>
                    <button type="button" class="ui-control-trigger">
                      <span>不关联合同</span>
                      <span aria-hidden="true">▾</span>
                    </button>
                  </div>
                  <div>
                    <label class="ui-form-label">客户<span class="ui-form-required">*</span></label>
                    <button type="button" class="ui-control-trigger">
                      <span>中国土木-洪水桥</span>
                      <span aria-hidden="true">▾</span>
                    </button>
                  </div>
                  <div>
                    <label class="ui-form-label">货物类型<span class="ui-form-required">*</span></label>
                    <button type="button" class="ui-control-trigger">
                      <span>AA</span>
                      <span aria-hidden="true">▾</span>
                    </button>
                  </div>
                  <div>
                    <label class="ui-form-label">方向</label>
                    <div class="ui-segmented">
                      <button type="button" class="ui-segmented-item is-active">采购</button>
                      <button type="button" class="ui-segmented-item">销售</button>
                    </div>
                  </div>
                </div>
              </section>

              <section class="section">
                <h4 class="section-title">过磅数据</h4>
                <div class="ui-form-grid">
                  <div>
                    <label class="ui-form-label">总重 Gross<span class="ui-form-required">*</span></label>
                    <div class="ui-input-affix">
                      <input class="ui-input-affix-input" value="30000" />
                      <span class="ui-input-affix-suffix">KG</span>
                    </div>
                  </div>
                  <div>
                    <label class="ui-form-label">皮重 Tare<span class="ui-form-required">*</span></label>
                    <div class="ui-input-affix">
                      <input class="ui-input-affix-input" value="20000" />
                      <span class="ui-input-affix-suffix">KG</span>
                    </div>
                  </div>
                  <div>
                    <label class="ui-form-label">扣减 Deduction</label>
                    <div class="ui-input-affix">
                      <input class="ui-input-affix-input" value="0" />
                      <span class="ui-input-affix-suffix">KG</span>
                    </div>
                  </div>
                  <div>
                    <label class="ui-form-label">单价 Unit Price<span class="ui-form-required">*</span></label>
                    <div class="ui-input-affix">
                      <input class="ui-input-affix-input" value="2.3" />
                      <span class="ui-input-affix-suffix">HK$/KG</span>
                    </div>
                  </div>
                  <div>
                    <label class="ui-form-label">净重 Net (KG)</label>
                    <div class="ui-form-readonly">
                      <span class="muted">净重 Net：10000 KG · 金额：</span>
                      <strong> HK$ 23000.00</strong>
                    </div>
                  </div>
                  <div>
                    <label class="ui-form-label">过磅时间<span class="ui-form-required">*</span></label>
                    <button type="button" class="ui-control-trigger is-open">
                      <span>2026-08-05 17:41</span>
                      <span aria-hidden="true">📅</span>
                    </button>
                  </div>
                  <div class="ui-form-span-2">
                    <label class="ui-form-label">合同锁定示例（disabled）</label>
                    <button type="button" class="ui-control-trigger" disabled>中国土木-洪水桥</button>
                  </div>
                </div>
              </section>

              <section class="section">
                <h4 class="section-title">补充信息</h4>
                <label class="ui-form-label">备注（可选）</label>
                <textarea class="ui-input" placeholder="如：已付现金、货柜号…"></textarea>
              </section>
            </div>
          </div>
          <div class="ui-modal-foot">
            <button type="button" class="ui-btn-secondary">取消</button>
            <button type="button" class="ui-btn-primary">保存</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const descriptions = {
        a: "<strong>方案 A · 当前线上：</strong>分区标题 14px 黑色加粗，标题下方有横线，区块间距 24px。",
        b: "<strong>方案 B · 顶线分隔：</strong>第二段起顶部有分隔线，标题 13px 灰色，无标题下划线。",
        c: "<strong>方案 C · 左色条：</strong>标题左侧靛紫色竖线，28px 区块间距，无横线。",
        d: "<strong>方案 D · 间距优先：</strong>32px 大间距 + 14px 深灰标题，最干净，无横线/色条。",
      };

      const root = document.getElementById("preview-root");
      const desc = document.getElementById("scheme-desc");
      const badge = document.getElementById("scheme-badge");
      const tabs = document.querySelectorAll(".scheme-tab");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const scheme = tab.dataset.scheme;
          root.className = "scheme-" + scheme;
          desc.innerHTML = descriptions[scheme];
          badge.textContent = "当前：方案 " + scheme.toUpperCase();
          tabs.forEach((t) => {
            const active = t === tab;
            t.classList.toggle("is-active", active);
            t.setAttribute("aria-selected", active ? "true" : "false");
          });
        });
      });
    </script>
  </body>
</html>
